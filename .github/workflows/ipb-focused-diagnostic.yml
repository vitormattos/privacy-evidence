name: IPB focused failure diagnostic

on:
  push:
    branches:
      - agent/ipb-live-demo

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install browser
        working-directory: browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Reproduce original deterministic sample
        shell: bash
        run: |
          set -u -o pipefail
          OUT="$RUNNER_TEMP/ipb-focused"
          mkdir -p "$OUT"

          php examples/hacktoberfest/ipb/source.php fetch "$OUT/snapshot.html" > "$OUT/source-fetch.json"
          php examples/hacktoberfest/ipb/source.php extract "$OUT/snapshot.html" "$OUT/population.csv" > "$OUT/source-extract.json"
          php bin/privacy-evidence source:sample-websites "$OUT/population.csv" "$OUT/sample.csv" \
            --limit=8 --seed=hacktoberfest-ipb-v1 > "$OUT/sample-provenance.json"

          set +e
          RUN_ID=$(php bin/privacy-evidence run "$OUT/sample.csv")
          RUN_EXIT=$?
          set -e

          printf '%s\n' "$RUN_ID" > "$OUT/run-id.txt"
          printf '%s\n' "$RUN_EXIT" > "$OUT/run-exit.txt"
          php bin/privacy-evidence status "$RUN_ID" > "$OUT/status.json"
          php bin/privacy-evidence analyze "$RUN_ID" > "$OUT/analyze.log"
          EXPORT_DIR=$(php bin/privacy-evidence report "$RUN_ID")
          cp -a "data/derived/runs/$RUN_ID" "$OUT/run-derived"
          cp -a "$EXPORT_DIR" "$OUT/export"
          cat "$OUT/status.json"

      - name: Preserve diagnostic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ipb-focused-failure-diagnostic
          path: ${{ runner.temp }}/ipb-focused
          retention-days: 7
