name: Psalm isolated validation

on:
  push:
    branches:
      - agent/ipb-live-demo

permissions:
  contents: read

jobs:
  psalm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer psalm
      - run: composer phpstan
