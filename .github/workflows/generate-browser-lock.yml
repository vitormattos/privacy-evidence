name: Generate browser lock

on:
  push:
    branches:
      - main
    paths:
      - 'browser/package.json'
      - '.github/workflows/generate-browser-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: browser-lock
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Synchronize with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Generate package lock
        working-directory: browser
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lock file when changed
        run: |
          if git diff --quiet -- browser/package-lock.json && git ls-files --error-unmatch browser/package-lock.json >/dev/null 2>&1; then
            echo "browser/package-lock.json is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/package-lock.json
          git commit -m "build: update browser package lock"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
