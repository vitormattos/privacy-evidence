name: IPB live demo

on:
  push:
    branches:
      - agent/ipb-live-demo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run live IPB demo
        run: |
          set -o pipefail
          examples/hacktoberfest/run-ipb-live-demo.sh | tee /tmp/ipb-live-demo.log
      - name: Preserve demo log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ipb-live-demo-log
          path: /tmp/ipb-live-demo.log
