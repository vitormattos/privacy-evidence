name: IPB full validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install browser dependencies
        working-directory: browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run complete IPB population validation
        shell: bash
        run: |
          set -euo pipefail

          OUT="$RUNNER_TEMP/ipb-full"
          mkdir -p "$OUT"

          echo '== 1. Preserve official directory snapshot ==' | tee "$OUT/full-run.log"
          php examples/hacktoberfest/ipb/source.php fetch "$OUT/ipb-anuario.html" 2>&1 | tee -a "$OUT/full-run.log"

          echo '== 2. Convert snapshot to canonical CSV ==' | tee -a "$OUT/full-run.log"
          php examples/hacktoberfest/ipb/source.php extract "$OUT/ipb-anuario.html" "$OUT/ipb-population.csv" 2>&1 | tee -a "$OUT/full-run.log"

          echo '== 3. Inspect/classify complete population ==' | tee -a "$OUT/full-run.log"
          php bin/privacy-evidence source:import "$OUT/ipb-population.csv" > "$OUT/source-import.jsonl"
          php bin/privacy-evidence source:stats "$OUT/ipb-population.csv" \
            | tee "$OUT/source-stats.json" | tee -a "$OUT/full-run.log"

          echo '== 4. Select every institutional website (no sampling) ==' | tee -a "$OUT/full-run.log"
          php bin/privacy-evidence source:select "$OUT/ipb-population.csv" "$OUT/ipb-sites.csv" \
            --type=institutional_website 2>&1 | tee -a "$OUT/full-run.log"

          printf 'population_rows=%s\n' "$(( $(wc -l < "$OUT/ipb-population.csv") - 1 ))" | tee -a "$OUT/full-run.log"
          printf 'selected_rows=%s\n' "$(( $(wc -l < "$OUT/ipb-sites.csv") - 1 ))" | tee -a "$OUT/full-run.log"

          echo '== 5. Enqueue complete source population; only eligible institutional websites are crawled ==' | tee -a "$OUT/full-run.log"
          RUN_ID=$(php bin/privacy-evidence run "$OUT/ipb-population.csv" --enqueue-only)
          printf '%s\n' "$RUN_ID" | tee "$OUT/run-id.txt"
          printf 'Run ID: %s\n' "$RUN_ID" | tee -a "$OUT/full-run.log"

          echo '== 6. Process HTTP crawl with bounded worker pool ==' | tee -a "$OUT/full-run.log"
          php bin/privacy-evidence workers "$RUN_ID" fetch \
            --workers=8 --max-jobs=100 --per-host-concurrency=2 --min-host-delay-ms=250 \
            2>&1 | tee -a "$OUT/full-run.log"

          echo '== 7. Process browser escalation with bounded worker pool ==' | tee -a "$OUT/full-run.log"
          php bin/privacy-evidence workers "$RUN_ID" browser \
            --workers=2 --max-jobs=50 --per-host-concurrency=1 --min-host-delay-ms=250 \
            2>&1 | tee -a "$OUT/full-run.log"

          echo '== 8. Finalize run and regulatory analysis ==' | tee -a "$OUT/full-run.log"
          set +e
          php bin/privacy-evidence run:resume "$RUN_ID" 2>&1 | tee -a "$OUT/full-run.log"
          RUN_EXIT=${PIPESTATUS[0]}
          set -e

          echo '== 9. Durable status ==' | tee -a "$OUT/full-run.log"
          php bin/privacy-evidence status "$RUN_ID" | tee "$OUT/status.json" | tee -a "$OUT/full-run.log"

          echo '== 10. Report/export for 100% of source population ==' | tee -a "$OUT/full-run.log"
          EXPORT_DIR=$(php bin/privacy-evidence report "$RUN_ID")
          printf '%s\n' "$EXPORT_DIR" | tee "$OUT/export-dir.txt"
          printf 'Export directory: %s\n' "$EXPORT_DIR" | tee -a "$OUT/full-run.log"

          cp -a "data/derived/runs/$RUN_ID" "$OUT/run-derived"
          cp -a "$EXPORT_DIR" "$OUT/export"

          if [ "$RUN_EXIT" -ne 0 ]; then
            echo 'Research run completed with terminal failures.' | tee -a "$OUT/full-run.log"
            exit "$RUN_EXIT"
          fi

      - name: Preserve complete validation artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ipb-full-validation
          path: |
            ${{ runner.temp }}/ipb-full
          retention-days: 7
