name: Publish reviewer forms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'tests/Browser/pages.test.mjs'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'tests/Browser/pages.test.mjs'

permissions:
  contents: read

concurrency:
  group: reviewer-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate published forms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - run: npm ci --prefix browser
      - run: npx --prefix browser playwright install --with-deps chromium
      - run: node --test tests/Browser/pages.test.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: reviewer-pages-screenshots
          path: /tmp/reviewer-pages-screenshots
          if-no-files-found: error
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload approved public HTML only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy reviewer forms
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
