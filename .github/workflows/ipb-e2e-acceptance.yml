name: IPB end-to-end acceptance

on:
  push:
    branches:
      - agent/ipb-live-demo

permissions:
  contents: read

jobs:
  ipb-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install browser
        working-directory: browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run full IPB acceptance
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ipb-e2e"
          mkdir -p "$OUT"

          php examples/hacktoberfest/ipb/source.php fetch "$OUT/source.html" > "$OUT/source-fetch.json"
          php examples/hacktoberfest/ipb/source.php extract "$OUT/source.html" "$OUT/population.csv" > "$OUT/source-extract.json"
          php bin/privacy-evidence source:import "$OUT/population.csv" > "$OUT/source-import.jsonl"

          echo '=== SOURCE CLASSIFICATION ==='
          php -r '
          $counts=[];$total=0;
          foreach(file($argv[1], FILE_IGNORE_NEW_LINES|FILE_SKIP_EMPTY_LINES) as $line){
              $row=json_decode($line,true,512,JSON_THROW_ON_ERROR);
              $type=$row["type"]??"unknown";
              $counts[$type]=($counts[$type]??0)+1;$total++;
          }
          ksort($counts);
          echo json_encode(["total"=>$total,"byType"=>$counts],JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES),PHP_EOL;
          ' "$OUT/source-import.jsonl" | tee "$OUT/source-classification.json"

          php bin/privacy-evidence source:select "$OUT/population.csv" "$OUT/sites.csv" --type=institutional_website > "$OUT/selection.json"
          echo "selected_institutional_websites=$(( $(wc -l < "$OUT/sites.csv") - 1 ))"

          set +e
          RUN_ID=$(php bin/privacy-evidence run "$OUT/sites.csv")
          RUN_EXIT=$?
          set -e
          printf '%s\n' "$RUN_ID" | tee "$OUT/run-id.txt"
          printf '%s\n' "$RUN_EXIT" | tee "$OUT/run-exit.txt"

          php bin/privacy-evidence status "$RUN_ID" > "$OUT/status.json"
          EXPORT_DIR=$(php bin/privacy-evidence report "$RUN_ID")
          cp -a "$EXPORT_DIR" "$OUT/export"

          echo '=== RUN STATUS ==='
          php -r '
          $s=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);
          echo json_encode([
            "status"=>$s["status"]??null,
            "jobs"=>$s["jobs"]??[],
            "observations"=>$s["observations"]??[],
            "telemetry"=>array_filter($s["telemetry"]??[],fn($k)=>str_starts_with($k,"resource_acquisition_failures")||str_starts_with($k,"terminal_failures")||str_starts_with($k,"jobs_retried")||str_starts_with($k,"browser_pages_acquired")||str_starts_with($k,"http_status."),ARRAY_FILTER_USE_KEY),
            "failureCount"=>count($s["failures"]??[])
          ],JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES),PHP_EOL;
          ' "$OUT/status.json" | tee "$OUT/run-summary.json"

          echo '=== LGPD PUBLIC-EVIDENCE STATES ==='
          php -r '
          $rows=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);
          $states=[];$requirements=[];$resources=0;
          foreach($rows as $row){
              if(($row["profile"]??null)!=="lgpd") continue;
              $resources++;
              $state=$row["publicEvidenceState"]??"unknown";
              $states[$state]=($states[$state]??0)+1;
              foreach(($row["requirements"]??[]) as $rstate=>$count){
                  $requirements[$rstate]=($requirements[$rstate]??0)+(int)$count;
              }
          }
          ksort($states);ksort($requirements);
          echo json_encode(["resources"=>$resources,"siteStates"=>$states,"requirementStates"=>$requirements],JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES),PHP_EOL;
          ' "$EXPORT_DIR/profile-summary.json" | tee "$OUT/lgpd-summary.json"

          echo '=== LGPD REQUIREMENT BREAKDOWN ==='
          php -r '
          $rows=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);
          $out=[];
          foreach($rows as $row){
              if(($row["profile"]??null)!=="lgpd") continue;
              $r=$row["result"]??[];
              $id=$r["id"]??"unknown";$state=$r["state"]??"unknown";
              $out[$id][$state]=($out[$id][$state]??0)+1;
          }
          ksort($out); foreach($out as &$v) ksort($v); unset($v);
          echo json_encode($out,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES),PHP_EOL;
          ' "$EXPORT_DIR/profiles.json" | tee "$OUT/lgpd-requirements.json"

          if [ "$RUN_EXIT" -ne 0 ]; then
            exit "$RUN_EXIT"
          fi
      - name: Preserve acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ipb-e2e-acceptance
          path: ${{ runner.temp }}/ipb-e2e
          retention-days: 7
