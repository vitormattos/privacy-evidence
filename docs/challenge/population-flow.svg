<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" aria-labelledby="t d">
<title id="t">IPB population accounting flow</title>
<desc id="d">Population flow from 2,993 source records through classification, eligibility and deduplication to 566 unique website measurement units. 2,404 non-eligible records remain retained with a reason.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z"/></marker>
<style>.n{fill:white;stroke:#333;stroke-width:2;rx:10}.x{fill:#fafafa;stroke:#666;stroke-width:2;stroke-dasharray:7 5;rx:10}.l{stroke:#333;stroke-width:2;fill:none;marker-end:url(#a)}.dl{stroke:#666;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#a)}text{font-family:Arial,sans-serif;font-size:18px;fill:#111}.s{font-size:16px}</style></defs>
<rect class="n" x="215" y="20" width="330" height="58"/><text x="380" y="55" text-anchor="middle">2,993 IPB source records</text>
<rect class="n" x="240" y="125" width="280" height="58"/><text x="380" y="160" text-anchor="middle">Source classification</text>
<rect class="x" x="500" y="230" width="240" height="82"/><text class="s" x="620" y="263" text-anchor="middle">2,404 not eligible for</text><text class="s" x="620" y="287" text-anchor="middle">website measurement</text>
<rect class="n" x="170" y="230" width="300" height="58"/><text x="320" y="265" text-anchor="middle">589 eligible source records</text>
<rect class="n" x="220" y="350" width="200" height="58"/><text x="320" y="385" text-anchor="middle">Deduplication</text>
<rect class="n" x="175" y="470" width="290" height="58"/><text x="320" y="505" text-anchor="middle">566 unique websites</text>
<rect class="n" x="145" y="575" width="350" height="58"/><text class="s" x="320" y="610" text-anchor="middle">Measurement and evidence analysis</text>
<path class="l" d="M380 78V125"/><path class="l" d="M350 183L320 230"/><path class="dl" d="M410 183L620 230"/><path class="l" d="M320 288V350"/><path class="l" d="M320 408V470"/><path class="l" d="M320 528V575"/>
<text class="s" x="575" y="210" text-anchor="middle">retained with reason</text>
</svg>