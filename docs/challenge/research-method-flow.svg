<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 980" role="img" aria-labelledby="t d">
<title id="t">Privacy Evidence methodological flow</title>
<desc id="d">Flow from IPB source population through preservation, classification, acquisition, deterministic and machine-learning evidence analysis, human review, regulatory mapping, and research interpretation. Non-eligible sources and acquisition failures are retained as observations.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z"/></marker>
<style>.n{fill:white;stroke:#333;stroke-width:2;rx:10}.x{fill:#fafafa;stroke:#666;stroke-width:2;stroke-dasharray:7 5;rx:10}.l{stroke:#333;stroke-width:2;fill:none;marker-end:url(#a)}.dl{stroke:#666;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#a)}text{font-family:Arial,sans-serif;font-size:18px;fill:#111}.s{font-size:16px}</style></defs>
<rect class="n" x="230" y="20" width="300" height="52"/><text x="380" y="52" text-anchor="middle">IPB source population</text>
<rect class="n" x="230" y="105" width="300" height="52"/><text x="380" y="137" text-anchor="middle">Preserve source records</text>
<rect class="n" x="205" y="190" width="350" height="52"/><text x="380" y="222" text-anchor="middle">Normalize and classify resources</text>
<rect class="x" x="555" y="285" width="190" height="72"/><text class="s" x="650" y="313" text-anchor="middle">Non-eligible sources</text><text class="s" x="650" y="337" text-anchor="middle">retained with reason</text>
<rect class="n" x="230" y="285" width="300" height="52"/><text x="380" y="317" text-anchor="middle">Eligibility and deduplication</text>
<rect class="n" x="205" y="380" width="350" height="52"/><text x="380" y="412" text-anchor="middle">Bounded HTTP / browser acquisition</text>
<rect class="x" x="555" y="475" width="190" height="72"/><text class="s" x="650" y="503" text-anchor="middle">Acquisition failures</text><text class="s" x="650" y="527" text-anchor="middle">retained as observations</text>
<rect class="n" x="230" y="475" width="300" height="52"/><text x="380" y="507" text-anchor="middle">Immutable acquired documents</text>
<rect class="n" x="60" y="585" width="280" height="62"/><text class="s" x="200" y="622" text-anchor="middle">Deterministic evidence detectors</text>
<rect class="n" x="420" y="585" width="280" height="62"/><text class="s" x="560" y="622" text-anchor="middle">PHP-native ML second opinion</text>
<rect class="n" x="230" y="705" width="300" height="52"/><text x="380" y="737" text-anchor="middle">Auditable human review</text>
<rect class="n" x="230" y="800" width="300" height="52"/><text x="380" y="832" text-anchor="middle">Versioned regulatory mapping</text>
<rect class="n" x="175" y="895" width="410" height="62"/><text class="s" x="380" y="932" text-anchor="middle">Derived metrics and research interpretation</text>
<path class="l" d="M380 72V105"/><path class="l" d="M380 157V190"/><path class="l" d="M380 242V285"/><path class="dl" d="M555 216H650V285"/><path class="l" d="M380 337V380"/><path class="l" d="M380 432V475"/><path class="dl" d="M555 406H650V475"/><path class="l" d="M330 527L220 585"/><path class="l" d="M430 527L540 585"/><path class="l" d="M200 647L330 705"/><path class="l" d="M560 647L430 705"/><path class="l" d="M380 757V800"/><path class="l" d="M380 852V895"/>
</svg>