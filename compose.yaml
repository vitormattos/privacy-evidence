services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - ./data:/app/data
    command: ["doctor"]

  browser:
    build:
      context: ./browser
      dockerfile: Dockerfile
    init: true
    ipc: private
    network_mode: bridge
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
