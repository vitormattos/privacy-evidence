<style>
:root { font-family: system-ui, sans-serif; color-scheme: light dark; }
body { margin: 0; background: Canvas; color: CanvasText; }
main { max-width: 920px; margin: 0 auto; padding: 24px; }
header { margin-bottom: 20px; }
h1 { margin-bottom: 8px; }
.notice { border: 1px solid ButtonBorder; border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
.warning { border-color: #b87800; background: color-mix(in srgb, #b87800 10%, Canvas); }
.error { color: #c0392b; font-weight: 600; min-height: 1.25em; }
.progress-shell { height: 10px; background: color-mix(in srgb, CanvasText 12%, Canvas); border-radius: 6px; overflow: hidden; }
.progress-bar { height: 100%; width: 0; background: AccentColor; }
.meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: .92rem; margin-top: 8px; }
.card { border: 1px solid ButtonBorder; border-radius: 12px; padding: 18px; margin: 18px 0; }
.label { font-size: .78rem; letter-spacing: .04em; opacity: .72; }
.excerpt { max-height: 55vh; overflow: auto; overflow-wrap: anywhere; white-space: pre-wrap; padding: 14px; border-left: 4px solid AccentColor; background: color-mix(in srgb, CanvasText 5%, Canvas); margin: 12px 0; }
.guidance { font-size: .95rem; }
.states { display: grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 8px; margin: 12px 0; }
.secondary-states { margin-top: 8px; }
button { padding: 10px 12px; border: 1px solid ButtonBorder; border-radius: 8px; cursor: pointer; font: inherit; }
button.selected { outline: 3px solid AccentColor; }
button.primary { background: AccentColor; color: AccentColorText; }
button:disabled { opacity: .45; cursor: not-allowed; }
textarea { width: 100%; min-height: 95px; box-sizing: border-box; padding: 10px; font: inherit; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
kbd { border: 1px solid ButtonBorder; border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; }
a { color: LinkText; overflow-wrap: anywhere; }
.small { font-size: .88rem; opacity: .82; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
@media (max-width: 600px) {
  main { padding: 14px; }
  .states { grid-template-columns: 1fr 1fr; }
}
</style>
</head>

<main>
<header>
<div class="toolbar">
<h1 id="title">Revisão humana independente</h1>
<button id="languageToggle" type="button">English</button>
</div>
<details><summary id="instructionsLabel">Instruções</summary><p id="intro"></p>
<div class="notice"><strong id="privacyTitle"></strong> <span id="privacyText"></span></div></details>
<div id="testNotice" class="notice warning" hidden></div>
<div id="queueNotice" class="notice"></div>
<div class="controls"><button id="queueToggle" type="button"></button></div>
<div class="progress-shell"><div id="progressBar" class="progress-bar"></div></div>
<div class="meta">
<span id="progressText"></span>
<span id="timeText"></span>
<span id="categoryText"></span>
</div>
</header>

<section class="card" id="evidenceCard">
<h2 id="sampleSite"></h2><p id="sampleUrl" class="small"></p>
<div class="notice"><strong id="sourceContextLabel"></strong> <a id="sourceUrl" target="_blank" rel="noopener noreferrer"></a><p class="small" id="sourceContextHelp"></p></div>
<div class="label" id="evidenceTypeLabel"></div>
<h2 id="type"></h2>
<details><summary id="criteriaLabel">Critério de avaliação</summary><div id="guidance" class="guidance notice"></div></details>
<p id="pageContext" class="small"></p><div id="contextWarning" class="notice warning" hidden></div>
<div class="label" id="excerptLabel"></div>
<div id="excerpt" class="excerpt"></div>
<details><summary id="provenanceLabel">Proveniência</summary><p class="small" id="artifactContext"></p></details>
<div id="missingEvidence" class="notice warning" hidden></div>

</section>

<section class="card" id="decisionCard">
<div class="label" id="humanStateLabel"></div>
<div id="primaryStates" class="states"></div>
<div class="controls">
<button id="moreStates" type="button"></button>
</div>
<div id="secondaryStates" class="states secondary-states" hidden></div>
<p class="small" id="shortcutHelp"></p>

<label for="rationale"><strong id="rationaleLabel"></strong></label>
<textarea id="rationale"></textarea>
<div class="controls" hidden>
<button id="rationaleHelper" type="button"></button>
<span class="small" id="rationaleHelp"></span>
</div>
<div id="validation" class="error" role="alert"></div>
</section>

<div class="controls">
<button id="previous" type="button"></button>
<button id="nextUnanswered" type="button"></button>
<button id="next" class="primary" type="button"></button>
<button id="export" type="button" disabled></button>
<span id="saveStatus" class="small"></span>
</div>

<details><summary id="methodLabel">Sobre esta revisão</summary><div class="notice small" id="biasNotice"></div></details>
</main>

const cases = packageData.cases;
const sortedOrder = cases.map((_, i) => i).sort((a, b) => {
  const type = String(cases[a].evidenceType).localeCompare(String(cases[b].evidenceType));
  return type !== 0 ? type : String(cases[a].evidenceId).localeCompare(String(cases[b].evidenceId));
});
function documentFor(c) { return (packageData.reviewDocuments || {})[c.artifactHash]; }
function hasPreservedExcerpt(c) {
  const doc = documentFor(c);
  return Boolean(c.reviewContext && c.reviewContext.reason === null && doc && typeof doc.text === 'string' && doc.text.trim());
}
const reviewOrder = sortedOrder.filter(i => testMode || hasPreservedExcerpt(cases[i]));
const deferredOrder = sortedOrder.filter(i => !hasPreservedExcerpt(cases[i]));
let showingDeferred = !testMode && reviewOrder.length === 0 && deferredOrder.length > 0;
let order = showingDeferred ? deferredOrder : reviewOrder;
const storageKey = 'privacy-evidence-review:' + reviewConfig.packageHash + ':' + (testMode ? 'test' : 'research') + ':' + location.pathname;
let position = 0;
let locale = 'pt';
let secondaryVisible = false;
let storageAvailable = true;
let timing = { durations: [], caseStarted: Date.now() };

function t() { return i18n[locale]; }
function currentCase() { return cases[order[position]]; }
function isComplete(c) { return Boolean(states.includes(c.humanState) && typeof c.rationale === 'string' && c.rationale.trim() && c.reviewedAt); }
function completedCount() { return reviewOrder.filter(i => isComplete(cases[i])).length; }

function loadProgress() {
  try {
    const savedLocale = localStorage.getItem(storageKey + ':locale');
    if (savedLocale === 'pt' || savedLocale === 'en') locale = savedLocale;
    const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
    if (!saved || !Array.isArray(saved.cases)) return;
    const byId = new Map(saved.cases.map(c => [c.evidenceId, c]));
    reviewOrder.forEach(i => {
      const c = cases[i];
      const s = byId.get(c.evidenceId);
      if (!s) return;
      c.humanState = states.includes(s.humanState) ? s.humanState : null;
      c.rationale = typeof s.rationale === 'string' ? s.rationale : null;
      c.reviewedAt = typeof s.reviewedAt === 'string' ? s.reviewedAt : null;
    });
    if (saved.timing && Array.isArray(saved.timing.durations)) {
      timing.durations = saved.timing.durations.filter(v => Number.isFinite(v));
    }
    position = reviewOrder.findIndex(i => !isComplete(cases[i]));
    if (position < 0) position = 0;
  } catch (_) { storageAvailable = false; }
}

function persist() {
  try {
    localStorage.setItem(storageKey, JSON.stringify({ cases, timing }));
    localStorage.setItem(storageKey + ':locale', locale);
    storageAvailable = true;
  } catch (_) { storageAvailable = false; }
  document.getElementById('saveStatus').textContent = storageAvailable ? t().saved : t().storageError;
}

function median(values) {
  const sorted = [...values].sort((a, b) => a - b);
  const middle = Math.floor(sorted.length / 2);
  return sorted.length % 2 === 0
    ? (sorted[middle - 1] + sorted[middle]) / 2
    : sorted[middle];
}

function guidanceFor(type) {
  return guidance[locale][type] || (locale === 'pt'
    ? 'Classifique somente o sinal indicado pelo tipo de evidência e somente com base no material preservado.'
    : 'Classify only the signal named by the evidence type and only from the preserved material.');
}

function stateButton(state, index) {
  const c = currentCase();
  const button = document.createElement('button');
  button.type = 'button';
  button.dataset.state = state;
  button.textContent = (index + 1) + '. ' + t().states[state];
  if (showingDeferred) {
    button.disabled = true;
    button.title = t().noExcerpt;
  }
  if (c.humanState === state) button.classList.add('selected');
  button.addEventListener('click', () => chooseState(state));
  return button;
}

function renderStateButtons() {
  const primary = document.getElementById('primaryStates');
  const secondary = document.getElementById('secondaryStates');
  primary.innerHTML = '';
  secondary.innerHTML = '';
  primaryStates.forEach((state, i) => primary.appendChild(stateButton(state, i)));
  secondaryStates.forEach((state, i) => secondary.appendChild(stateButton(state, i + primaryStates.length)));
  const selectedSecondary = secondaryStates.includes(currentCase().humanState);
  secondary.hidden = !(secondaryVisible || selectedSecondary);
  document.getElementById('moreStates').textContent = secondary.hidden ? t().more : t().fewer;
}

function renderStaticText() {
  const text = t();
  document.documentElement.lang = locale === 'pt' ? 'pt-BR' : 'en';
  document.getElementById('title').textContent = text.title;
  document.getElementById('languageToggle').textContent = text.language;
  document.getElementById('intro').textContent = text.intro;
  document.getElementById('privacyTitle').textContent = text.privacyTitle;
  document.getElementById('privacyText').textContent = text.privacyText;
  document.getElementById('evidenceTypeLabel').textContent = text.evidenceType;
  document.getElementById('excerptLabel').textContent = text.excerpt;
  document.getElementById('sourceContextLabel').textContent = text.sourceContext;
  document.getElementById('sourceContextHelp').textContent = text.sourceHelp;
  document.getElementById('humanStateLabel').textContent = text.humanState;
  document.getElementById('shortcutHelp').textContent = text.shortcuts;
  document.getElementById('rationaleLabel').textContent = text.rationale;
  document.getElementById('rationale').placeholder = text.rationalePlaceholder;
  document.getElementById('rationaleHelper').textContent = text.rationaleButton;
  document.getElementById('rationaleHelp').textContent = text.rationaleHelp;
  document.getElementById('previous').textContent = text.previous;
  document.getElementById('nextUnanswered').textContent = text.nextUnanswered;
  document.getElementById('export').textContent = !testMode && reviewOrder.length === 0 ? text.pendingExport : text.export;
  document.getElementById('biasNotice').textContent = text.bias;
  document.getElementById('testNotice').hidden = !testMode;
  document.getElementById('testNotice').textContent = text.testNotice;
  document.getElementById('queueNotice').textContent = text.queue + ' ' + cases.length + ' — ' + sortedOrder.filter(i => hasPreservedExcerpt(cases[i])).length + ' ' + text.reviewable + '; ' + deferredOrder.length + ' ' + text.deferred + '.';
  document.getElementById('queueToggle').hidden = testMode || deferredOrder.length === 0 || reviewOrder.length === 0;
  document.getElementById('queueToggle').textContent = showingDeferred ? text.showReview : text.showDeferred;
}

function render() {
  renderStaticText();
  const c = currentCase();
  const text = t();
  document.getElementById('evidenceCard').hidden = !c;
  document.getElementById('decisionCard').hidden = !c || showingDeferred;
  document.getElementById('next').disabled = !c;
  document.getElementById('next').hidden = !c;
  document.getElementById('previous').hidden = !c;
  document.getElementById('nextUnanswered').hidden = !c || showingDeferred;
  document.getElementById('previous').disabled = !c || position === 0;
  document.getElementById('nextUnanswered').disabled = !c || showingDeferred || completedCount() === reviewOrder.length;
  document.getElementById('export').disabled = cases.length === 0 || completedCount() !== reviewOrder.length;
  document.getElementById('progressText').textContent = reviewOrder.length
    ? completedCount() + ' / ' + reviewOrder.length + ' ' + text.completed
    : (cases.length ? text.noReviewable : text.empty);
  document.getElementById('progressBar').style.width = (reviewOrder.length ? completedCount() / reviewOrder.length * 100 : 0) + '%';
  document.getElementById('categoryText').textContent = c ? text.case + ' ' + (position + 1) + ' / ' + order.length : text.empty;
  document.getElementById('timeText').textContent = reviewOrder.length
    ? (completedCount() === reviewOrder.length ? text.finished : '')
    : (cases.length ? text.preparationRequired : '');
  if (!storageAvailable) document.getElementById('saveStatus').textContent = text.storageError;
  if (!c) return;
  const context = c.reviewContext || {};
  const doc = documentFor(c);
  document.getElementById('sampleSite').textContent = context.resourceName || (locale === 'pt' ? 'Site da amostra não identificado' : 'Sampled website unidentified');
  document.getElementById('sampleUrl').textContent = (context.resourceUrl || '') + ' · Resource ID: ' + c.resourceId;
  document.getElementById('type').textContent = questions[locale][c.evidenceType] || String(c.evidenceType).replaceAll('_', ' ');
  document.getElementById('pageContext').textContent = (doc?.title || '') + ' · ' + (locale === 'pt' ? 'Coletado em: ' : 'Collected at: ') + (context.fetchedAt || '—');
  const warnings = [];
  if (context.truncated) warnings.push(locale === 'pt' ? 'A coleta foi truncada. Use “Não é possível concluir” se a resposta depender da parte não preservada.' : 'The collection was truncated. Use Unknown if the answer requires the missing part.');
  try {
    if (new URL(context.resourceUrl).hostname !== new URL(c.sourceUrl).hostname) warnings.push(locale === 'pt' ? 'Esta página está em outro domínio. O vínculo da coleta não comprova que ela descreve o tratamento de dados do site da amostra.' : 'This page is on another domain. A crawl link does not prove it describes processing by the sampled website.');
  } catch (_) {}
  document.getElementById('contextWarning').hidden = warnings.length === 0;
  document.getElementById('contextWarning').textContent = warnings.join(' ');
  const labels = locale === 'pt' ? ['Instruções', 'Critério de avaliação', 'Proveniência', 'Sobre esta revisão'] : ['Instructions', 'Assessment criteria', 'Provenance', 'About this review'];
  ['instructionsLabel', 'criteriaLabel', 'provenanceLabel', 'methodLabel'].forEach((id, i) => { document.getElementById(id).textContent = labels[i]; });
  document.getElementById('guidance').textContent = guidanceFor(c.evidenceType);
  document.getElementById('excerpt').textContent = doc && doc.text
    ? doc.text
    : (locale === 'pt' ? '[Nenhuma evidência textual foi preservada neste caso.]' : '[No preserved text evidence is available for this case.]');

  const missing = document.getElementById('missingEvidence');
  missing.hidden = hasPreservedExcerpt(c);
  const reason = contextReasons[locale][context.reason] || text.noExcerpt;
  missing.textContent = reason + ' ' + (locale === 'pt' ? 'Caso mantido para investigação, sem exigir uma resposta. O site ao vivo não substitui a coleta original.' : 'Case retained for investigation without requiring an answer. A live website does not replace the original collection.');

  const link = document.getElementById('sourceUrl');
  link.removeAttribute('href');
  try {
    const url = new URL(c.sourceUrl);
    if (url.protocol === 'https:' || url.protocol === 'http:') link.href = url.href;
  } catch (_) {}
  link.textContent = c.sourceUrl || (locale === 'pt' ? 'Sem URL de origem' : 'No source URL');
  document.getElementById('artifactContext').textContent = 'Artifact SHA-256: ' + (c.artifactHash || '—') + ' · Evidence ID: ' + c.evidenceId;
  document.getElementById('rationale').value = c.rationale || '';
  document.getElementById('validation').textContent = '';

  renderStateButtons();

  const done = completedCount();
  const pct = reviewOrder.length ? (done / reviewOrder.length) * 100 : 0;
  document.getElementById('progressBar').style.width = pct.toFixed(1) + '%';
  document.getElementById('progressText').textContent = reviewOrder.length
    ? done + ' / ' + reviewOrder.length + ' ' + text.completed
    : text.noReviewable;
  document.getElementById('categoryText').textContent = text.case + ' ' + (position + 1) + ' / ' + order.length;

  const validDurations = (timing.durations || []).filter(v => v >= 5 && v <= 600);
  if (reviewOrder.length === 0) {
    document.getElementById('timeText').textContent = text.preparationRequired;
  } else if (done === reviewOrder.length) {
    document.getElementById('timeText').textContent = text.finished;
  } else if (done < minimumForEstimate || validDurations.length < minimumForEstimate) {
    document.getElementById('timeText').textContent = done === 0
      ? text.estimatedWorkload + ' ' + reviewOrder.length + ' ' + text.cases
      : text.estimatePending;
  } else {
    const secondsPerCase = median(validDurations);
    const minutes = Math.max(1, Math.round(((reviewOrder.length - done) * secondsPerCase) / 60));
    document.getElementById('timeText').textContent = text.estimateRemaining + ' ' + minutes + ' ' + text.minutes;
  }

  document.getElementById('previous').disabled = position === 0;
  document.getElementById('next').textContent = showingDeferred
    ? (position === order.length - 1 ? text.inspectLast : text.inspectNext)
    : (position === order.length - 1 ? text.save : text.next);
  document.getElementById('next').disabled = showingDeferred && position === order.length - 1;
  document.getElementById('export').disabled = cases.length === 0 || done !== reviewOrder.length;
}

function chooseState(state) {
  const c = currentCase();
  if (!c || showingDeferred || !states.includes(state)) return;
  saveDraftRationale();
  c.humanState = state;
  c.reviewedAt = null;
  persist();
  render();
  document.getElementById('rationale').focus();
}

function saveCurrent(advance) {
  const c = currentCase();
  if (!c) return false;
  if (showingDeferred) {
    if (advance && position < order.length - 1) position++;
    render();
    return true;
  }
  c.rationale = document.getElementById('rationale').value.trim();
  if (!c.humanState || !c.rationale) {
    document.getElementById('validation').textContent = t().validation;
    return false;
  }

  const firstCompletion = !c.reviewedAt;
  if (firstCompletion) {
    c.reviewedAt = new Date().toISOString();
    const seconds = Math.round((Date.now() - timing.caseStarted) / 1000);
    if (seconds > 0) timing.durations.push(seconds);
  }

  persist();
  if (advance && position < order.length - 1) position++;
  timing.caseStarted = Date.now();
  render();
  return true;
}

function jumpToNextUnanswered() {
  if (showingDeferred) return;
  saveDraftRationale();
  for (let step = 1; step <= order.length; step++) {
    const candidate = (position + step) % order.length;
    if (!isComplete(cases[order[candidate]])) {
      position = candidate;
      timing.caseStarted = Date.now();
      render();
      return;
    }
  }
}

function saveDraftRationale() {
  const c = currentCase();
  if (!c || showingDeferred) return;
  const value = document.getElementById('rationale').value;
  if (c.rationale !== value) c.reviewedAt = null;
  c.rationale = value;
  persist();
}

function exportPackage() {
  saveDraftRationale();
  if (cases.length === 0 || completedCount() !== reviewOrder.length) return;
  const blob = new Blob([JSON.stringify(packageData, null, 2) + '\n'], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = testMode ? 'privacy-evidence-review-TEST.json'
    : (reviewOrder.length === 0 ? 'privacy-evidence-review-pending.json' : 'privacy-evidence-review-completed.json');
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

document.getElementById('languageToggle').addEventListener('click', () => {
  saveDraftRationale();
  locale = locale === 'pt' ? 'en' : 'pt';
  persist();
  render();
});
document.getElementById('moreStates').addEventListener('click', () => {
  secondaryVisible = document.getElementById('secondaryStates').hidden;
  renderStateButtons();
});
document.getElementById('rationale').addEventListener('input', () => {
  document.getElementById('validation').textContent = '';
  saveDraftRationale();
  const done = completedCount();
  document.getElementById('export').disabled = cases.length === 0 || done !== reviewOrder.length;
  document.getElementById('nextUnanswered').disabled = done === reviewOrder.length;
  document.getElementById('progressText').textContent = done + ' / ' + reviewOrder.length + ' ' + t().completed;
  document.getElementById('progressBar').style.width = (reviewOrder.length ? done / reviewOrder.length * 100 : 100) + '%';
});
document.getElementById('rationaleHelper').addEventListener('click', () => {
  const c = currentCase();
  if (!c || showingDeferred) return;
  if (!c.humanState) {
    document.getElementById('validation').textContent = t().chooseStateFirst;
    return;
  }
  const area = document.getElementById('rationale');
  if (!area.value.trim()) {
    const readableType = String(c.evidenceType).replaceAll('_', ' ');
    area.value = rationaleTemplates[locale][c.humanState](readableType);
  }
  area.focus();
  saveDraftRationale();
});
document.getElementById('previous').addEventListener('click', () => {
  saveDraftRationale();
  if (position > 0) position--;
  timing.caseStarted = Date.now();
  render();
});
document.getElementById('queueToggle').addEventListener('click', () => {
  saveDraftRationale();
  showingDeferred = !showingDeferred;
  order = showingDeferred ? deferredOrder : reviewOrder;
  position = 0;
  timing.caseStarted = Date.now();
  render();
});
document.getElementById('next').addEventListener('click', () => saveCurrent(true));
document.getElementById('nextUnanswered').addEventListener('click', jumpToNextUnanswered);
document.getElementById('export').addEventListener('click', exportPackage);
document.addEventListener('keydown', event => {
  if (event.target && ['TEXTAREA', 'INPUT', 'SELECT'].includes(event.target.tagName)) {
    if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
      event.preventDefault();
      saveCurrent(true);
    }
    return;
  }
  const number = Number(event.key);
  if (number >= 1 && number <= states.length) chooseState(states[number - 1]);
});

loadProgress();
render();
</script>
</body>
</html>
